name: PR Scope Gate

# Personal fork — upstream scope-approved issue gate is disabled.
# This workflow only posts friendly advisories (e.g. PR from fork main).
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  scope-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate PR (fork — advisories only)
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const number = pr.number;

            const FORK_DEFAULTS = new Set(['main', 'master']);
            const headRepoName = pr.head && pr.head.repo ? pr.head.repo.full_name : null;
            const isFork = headRepoName && headRepoName !== pr.base.repo.full_name;
            const forkMainWarn = isFork && FORK_DEFAULTS.has(pr.head.ref);

            const advisories = [];
            if (forkMainWarn) {
              advisories.push(
                `⚠️ **PR opened from your fork's \`${pr.head.ref}\` branch.** Consider a topic branch — see [CONTRIBUTING.md](https://github.com/${owner}/${repo}/blob/main/.github/CONTRIBUTING.md).`
              );
            }

            const marker = '<!-- pr-scope-gate -->';
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: number });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (!advisories.length) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'needs-scope-approval' });
              } catch (e) {}
              core.setOutput('blocked', 'false');
              return;
            }

            const lines = [
              marker,
              `Hi @${pr.user.login} — thanks for the PR!`,
              '',
              ...advisories,
              '',
              `This fork does not require upstream scope-approved issues. See [CONTRIBUTING.md](https://github.com/${owner}/${repo}/blob/main/.github/CONTRIBUTING.md).`,
            ];
            const body_md = lines.join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: body_md });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: body_md });
            }

            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: 'needs-scope-approval' });
            } catch (e) {}
            core.setOutput('blocked', 'false');
